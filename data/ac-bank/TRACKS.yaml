# Resume tracks — one identity per resume. Every job is put on one track from its title; the
# track can change how many bullets each employer gets, which projects may appear, and how many
# AI bullets are allowed. Titles shown at each employer follow `employer_titles` below.
# Decided by Atishay on 2026-10-01. Bullet counts and projects are decided for the AI track only;
# the other tracks use the planner's defaults until he decides theirs.
# Loader, classifier and planner overrides: scripts/ac-tracks.mjs

tracks:
  ai-engineer:
    label: AI engineer
    # Title words that put a job on this track (ML engineer roles included).
    title_patterns: ['\bai\b', 'machine learning', '\bml\b', '\bllm', 'agentic', 'genai', 'generative', 'deep learning', '\bnlp\b', 'computer vision', 'mlops']
    # Stony Brook and Wake Forest lead for AI; Accolite stays short. 11 in all, as on every other
    # track: with two projects, 12 pushed Technical Skills onto a second page (2026-10-05).
    experience_bullets:
      stony-brook: 5
      wake-forest: 4
      accolite: 2
    # The newest project first, the second by fit to the JD. Never the Java insurance platform.
    projects: [atriveo, mri-research, user-data-platform]
    # Bullets that claim the "ai" concept (every other track: planner default, 4).
    max_ai_bullets: 12
    # The fixed SWE keyword list (ATS_COVERAGE_MATRIX.yaml) caps LangChain, RAG and Python at
    # 2-4 mentions; an AI JD wants them repeated, so it doesn't steer bullet choice here.
    ats_matrix: false

  data-science:
    label: Data science
    title_patterns: ['data scien', 'applied scien', 'research scien', 'machine learning scien', '\bml scien', 'quantitative', 'statistic']
    # Titles on DS resumes, from Atishay's own DS resume (2026-10-08).
    stony_brook_title: Graduate Data Analyst
    employer_titles:
      wake-forest: AI and Data Analytics Intern
      accolite: Senior Software Engineer
    # The tested DS set (docs/resume-tracks/ds-da.md). Every data-science-track resume uses these; skills still tailor.
    pinned:
      experience:
        stony-brook: [AC-215, AC-216, AC-217, AC-199]
        wake-forest: [AC-218, AC-219, AC-220, AC-221]
        accolite: [AC-222, AC-223, AC-224]
      projects:
        atriveo: [AC-225]
        mri-research: [AC-114]
      project_stacks:
        atriveo: [Python, TypeScript, MongoDB, LLMs, Node.js]
    # Analytics set (2026-10-08): DS postings that are really BI/reporting roles (8+ of these signals: 3 of 30 DS
    # postings, 54 of 690 overall, all three lost to the analyst-style resume with the default set). docs/resume-tracks/ds-da.md.
    pinned_variants:
      - name: analytics
        when: { min_signals: 8, signals: [power bi, tableau, looker, dashboard, dashboards, dashboarding, reporting, reports, excel, business intelligence, kpi, kpis, visualization, visualizations, data quality, operational, trends, stakeholder, stakeholders, metrics, sql] }
        experience:
          stony-brook: [AC-215, AC-226, AC-216, AC-217]
          wake-forest: [AC-220, AC-218, AC-221, AC-219]
          accolite: [AC-223, AC-224, AC-190, AC-222]
        projects:
          atriveo: [AC-225]
          mri-research: [AC-114]
        project_stacks:
          atriveo: [Python, SQL, MongoDB, TypeScript, Node.js]

  data-analytics:
    label: Data analytics
    title_patterns: ['data analyst', 'analytics', 'business intelligence', '\bbi\b', 'business analyst', 'insights analyst', 'product analyst']
    exclude_patterns: ['engineer']

  forward-deployed:
    label: Forward deployed
    title_patterns: ['forward.?deploy', 'deployment strategist', 'solutions? engineer', 'customer engineer', 'field engineer', 'implementation engineer']
    # The tested FDE set (docs/resume-tracks/fde.md: preferred on 27 of 30 real FDE postings in a blind review against
    # the previous FDE resume). Every FDE resume uses exactly these bullets; tailoring still sets the skills section.
    # "AC-001:fde" is that entry's wording with facet fde; a bare id is its first wording.
    pinned:
      experience:
        stony-brook: [AC-200, AC-004:fde, AC-001:fde, AC-201]
        wake-forest: [AC-202, AC-203, AC-204, AC-047:fde]
        accolite: [AC-205, AC-171, AC-206]
      projects:
        atriveo: [AC-207, AC-208, AC-209]
        insurance-platform: [AC-066]
      # The tools after a project's name (else picked from its bullets).
      project_stacks:
        atriveo: [TypeScript, React, Node.js, MongoDB, Playwright, Docker]
    # Other tested sets, each used when its rule matches the posting (title + JD); else the set above. Infrastructure:
    # postings with 6+ distinct infrastructure signals (FDE median is 1; the three infrastructure FDE roles that beat
    # the set above had 8-10, every posting it won had 4 or fewer). docs/resume-tracks/fde.md.
    pinned_variants:
      - name: infrastructure
        when: { min_signals: 6, signals: [kubernetes, k8s, terraform, helm, docker, ci/cd, cicd, observability, prometheus, grafana, datadog, sre, site reliability, infrastructure, gpu, bare metal, on-prem, networking, linux, distributed systems, devops, incident, uptime, latency, telemetry, cloud infrastructure, platform engineering, data pipelines, etl, kafka, spark] }
        experience:
          stony-brook: [AC-200, AC-004:fde, AC-199, AC-001:fde]
          wake-forest: [AC-202, AC-203, AC-204]
          accolite: [AC-205, AC-191, AC-190, AC-189]
        projects:
          atriveo: [AC-208, AC-210]
          insurance-platform: [AC-070:fde, AC-068]
        project_stacks:
          atriveo: [Node.js, MongoDB, Docker, Oracle Cloud, Playwright, TypeScript]

  software-engineer:
    label: Software engineer
    # Data engineer roles included. Accolite leads for full-stack work.
    title_patterns: ['engineer', 'developer', '\bsde\b', '\bswe\b', 'software', 'programmer', 'full.?stack', 'backend', 'frontend']
    # Stony Brook's title on this track's resumes (2026-10-08, Atishay): Software Engineer, whatever the posting calls
    # the role (Backend, Data, Full Stack...). Exact overrides and stony_brook_title_patterns come first.
    stony_brook_title: Software Engineer
    # The tested SWE set (docs/resume-tracks/swe.md: preferred on 27 of 30 SWE postings, 10/10 full stack, in a blind
    # review against the previous SWE resume). Every software-engineer-track resume uses these; skills still tailor.
    pinned:
      experience:
        stony-brook: [AC-211, AC-019, AC-003, AC-025]
        wake-forest: [AC-047, AC-033, AC-031:production-ml]
        accolite: [AC-212, AC-190, AC-191, AC-213, AC-183:swe]
      projects:
        atriveo: [AC-214, AC-057]
        insurance-platform: [AC-067]
      project_stacks:
        atriveo: [React, TypeScript, Node.js, MongoDB, FastAPI, PostgreSQL]

# Checked in this order; the first track whose pattern matches the job title wins.
order: [forward-deployed, data-science, data-analytics, ai-engineer, software-engineer]

# The title shown at each employer, on every track. Stony Brook, the latest role, shows the role
# being applied for: the resume's header title without seniority words (Senior, II, Intern...).
# Titles name the role only: "Deep Learning" may be a skill, never part of a title.
# Atishay confirmed "Senior Software Developer" for Accolite on every track (2026-10-05).
employer_titles:
  wake-forest: AI/ML Engineer
  accolite: Senior Software Developer
stony_brook_title_overrides: {}
  # Was "Data Scientist: Data Scientist (Research)"; 2026-10-08 the DS track sets Stony Brook's title instead
  # (tracks.data-science.stony_brook_title), from Atishay's own DS resume.
# A header title containing one of these (any case) prints this title at Stony Brook, when no exact override above
# matches. FDE postings word the title many ways ("Forward Deployed Software Engineer", "AI Forward Deployed
# Engineer"). 2026-10-08, Atishay: Stony Brook is "AI Engineer" on FDE resumes, since FDE is a company title and the
# work there sat between AI and software engineering (docs/resume-tracks/fde.md).
stony_brook_title_patterns:
  - match: forward deployed
    title: AI Engineer

# Skills Atishay confirmed using (2026-10-01). Truth rule: a skill may appear in the Technical
# Skills section once it is listed here (and only when the JD asks for it); a bullet may name it
# only at an employer listed for it. Names match data/ac-bank skill names (skills-library.mjs).
confirmed_skills:
  stony-brook: [PyTorch, TensorFlow, scikit-learn, LangGraph, Vector Databases, Hugging Face, MLflow, MLOps, AWS Bedrock, FinBERT, Pinecone, R, SQL, Excel, Tableau, Power BI, Plotly, R Shiny, Statistical Analysis, A/B Testing, Time Series Forecasting, Predictive Modeling, Model Evaluation, Hypothesis Testing, Regression, Pandas, NumPy, Data Visualization, Dashboards]
  wake-forest: [PyTorch, TensorFlow, scikit-learn, Vector Databases, Anthropic, N4ITK, R, SQL, Excel, XGBoost, LightGBM, ggplot2, R Shiny, Statistical Analysis, A/B Testing, Predictive Modeling, Model Evaluation, Hypothesis Testing, Regression, Pandas, NumPy, Data Visualization]
  # 2026-10-08 (docs/resume-tracks/facts): A/B tests, SQL and Power BI dashboards at Accolite.
  accolite: [SQL, Power BI, A/B Testing, Dashboards, Excel]
  # Used, employer not said yet: skills section only until he says where.
  unplaced: [Spark, ChromaDB, Generative AI, Prompt Engineering, Function Calling, OpenAI, GitHub Copilot, Git, NoSQL, MCP, Deep Learning]
  # Asked about and not confirmed: never claim.
  not_confirmed: [FAISS, Fine-tuning, LlamaIndex, Kubeflow, Milvus, Conversational AI]
