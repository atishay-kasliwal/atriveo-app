# Resume tracks — one identity per resume. Every job is put on one track from its title; the
# track can change how many bullets each employer gets, which projects may appear, and how many
# AI bullets are allowed. Titles shown at each employer follow `employer_titles` below.
# Decided by Atishay on 2026-10-01. Bullet counts and projects are decided for the AI track only;
# the other tracks use the planner's defaults until he decides theirs.
# Loader, classifier and planner overrides: scripts/ac-tracks.mjs

tracks:
  ai-engineer:
    label: AI engineer
    # Title words that put a job on this track (ML engineer roles included).
    title_patterns: ['\bai\b', 'machine learning', '\bml\b', '\bllm', 'agentic', 'genai', 'generative', 'deep learning', '\bnlp\b', 'computer vision', 'mlops']
    # Stony Brook and Wake Forest lead for AI; Accolite stays short. 11 in all, as on every other
    # track: with two projects, 12 pushed Technical Skills onto a second page (2026-10-05).
    experience_bullets:
      stony-brook: 5
      wake-forest: 4
      accolite: 2
    # The newest project first, the second by fit to the JD. Never the Java insurance platform.
    projects: [atriveo, mri-research, user-data-platform]
    # Bullets that claim the "ai" concept (every other track: planner default, 4).
    max_ai_bullets: 12
    # The fixed SWE keyword list (ATS_COVERAGE_MATRIX.yaml) caps LangChain, RAG and Python at
    # 2-4 mentions; an AI JD wants them repeated, so it doesn't steer bullet choice here.
    ats_matrix: false

  data-science:
    label: Data science
    title_patterns: ['data scien', 'applied scien', 'research scien', 'machine learning scien', '\bml scien', 'quantitative', 'statistic']

  data-analytics:
    label: Data analytics
    title_patterns: ['data analyst', 'analytics', 'business intelligence', '\bbi\b', 'business analyst', 'insights analyst', 'product analyst']
    exclude_patterns: ['engineer']

  forward-deployed:
    label: Forward deployed
    title_patterns: ['forward.?deploy', 'deployment strategist', 'solutions? engineer', 'customer engineer', 'field engineer', 'implementation engineer']
    # The tested FDE set (docs/resume-tracks/fde.md: preferred on 27 of 30 real FDE postings in a blind review against
    # the previous FDE resume). Every FDE resume uses exactly these bullets; tailoring still sets the skills section.
    # "AC-001:fde" is that entry's wording with facet fde; a bare id is its first wording.
    pinned:
      experience:
        stony-brook: [AC-200, AC-004:fde, AC-001:fde, AC-201]
        wake-forest: [AC-202, AC-203, AC-204, AC-047:fde]
        accolite: [AC-205, AC-171, AC-206]
      projects:
        atriveo: [AC-207, AC-208, AC-209]
        insurance-platform: [AC-066]
      # The tools after a project's name (else picked from its bullets).
      project_stacks:
        atriveo: [TypeScript, React, Node.js, MongoDB, Playwright, Docker]

  software-engineer:
    label: Software engineer
    # Data engineer roles included. Accolite leads for full-stack work.
    title_patterns: ['engineer', 'developer', '\bsde\b', '\bswe\b', 'software', 'programmer', 'full.?stack', 'backend', 'frontend']

# Checked in this order; the first track whose pattern matches the job title wins.
order: [forward-deployed, data-science, data-analytics, ai-engineer, software-engineer]

# The title shown at each employer, on every track. Stony Brook, the latest role, shows the role
# being applied for: the resume's header title without seniority words (Senior, II, Intern...).
# Titles name the role only: "Deep Learning" may be a skill, never part of a title.
# Atishay confirmed "Senior Software Developer" for Accolite on every track (2026-10-05).
employer_titles:
  wake-forest: AI/ML Engineer
  accolite: Senior Software Developer
stony_brook_title_overrides:
  Data Scientist: Data Scientist (Research)
# A header title containing one of these (any case) prints this title at Stony Brook, when no exact override above
# matches. FDE postings word the title many ways ("Forward Deployed Software Engineer", "AI Forward Deployed
# Engineer"). 2026-10-08, Atishay: Stony Brook is "AI Engineer" on FDE resumes, since FDE is a company title and the
# work there sat between AI and software engineering (docs/resume-tracks/fde.md).
stony_brook_title_patterns:
  - match: forward deployed
    title: AI Engineer

# Skills Atishay confirmed using (2026-10-01). Truth rule: a skill may appear in the Technical
# Skills section once it is listed here (and only when the JD asks for it); a bullet may name it
# only at an employer listed for it. Names match data/ac-bank skill names (skills-library.mjs).
confirmed_skills:
  stony-brook: [PyTorch, TensorFlow, scikit-learn, LangGraph, Vector Databases, Hugging Face, MLflow, MLOps, AWS Bedrock, FinBERT]
  wake-forest: [PyTorch, TensorFlow, scikit-learn, Vector Databases, Anthropic, N4ITK]
  # Used, employer not said yet: skills section only until he says where.
  unplaced: [Pinecone, ChromaDB, Generative AI, Prompt Engineering, Function Calling, OpenAI, GitHub Copilot, Git, NoSQL, MCP, Deep Learning]
  # Asked about and not confirmed: never claim.
  not_confirmed: [FAISS, Fine-tuning, LlamaIndex, Kubeflow, Milvus, Conversational AI]
