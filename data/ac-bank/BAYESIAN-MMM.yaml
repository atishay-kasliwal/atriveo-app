  resume_pick_count: 2
  github: https://github.com/atishay-kasliwal/bayesian-marketing-mix-model

product:
  name: End-to-end Marketing Mix Model
  problem: >
    Marketing teams need to quantify channel ROI, model diminishing returns, and reallocate
    budget with statistical confidence — not gut feel.
  solution: >
    Python MMM pipeline: synthetic 156-week dataset, adstock + Hill saturation transforms,
    Ridge regression, channel ROAS/ROI decomposition, A/B holdout validation, 1,000-run Monte
    Carlo, 5-fold time-series CV, budget optimization, Tableau CSV exports.
  stack:
    modeling: [Python, scikit-learn Ridge, SciPy]
    data: [pandas, NumPy]
    viz: [Matplotlib, Seaborn, Plotly]
    optional: [PyMC-Marketing]
    validation: [A/B holdout, Monte Carlo, TimeSeriesSplit]

metrics:
  model_performance:
    r_squared: 0.9489
    mape: "2.74%"
    rmse: 28.67
  dataset:
    weeks: 156
    years: 3
    channels: 5
    total_spend: "$55,946K"
  top_channel:
    name: Email
    roas: 0.250
    roi: "+1,152%"
  validation:
    monte_carlo_runs: 1000
    cv_folds: 5
    ci_coverage: "90%"

