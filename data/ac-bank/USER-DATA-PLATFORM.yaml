product:
  name: Consent-first external-agent samples for Hushh personal data platform
  problem: >
    Third-party agents need a wire-correct, consent-first integration path to read scoped personal vault
    exports without holding user keys or bypassing audit trails.
  solution: >
    FastAPI external-agent sample exercising /api/v1 consent flow: scope discovery, approval polling,
    client-side X25519 ECDH + AES-GCM decryption, 4 trust invariants documentation, Claude Desktop MCP demo,
    mock-mode /ask endpoints, and verified smoke tests.
  stack:
    backend: [FastAPI, Python]
    crypto: [X25519, AES-GCM, ECDH]
    integration: [Hushh /api/v1, MCP]
    docs: [trust invariants, gap analysis, 90-day roadmap]
  note: Downstream consumer of hushh-research — not a Postgres/Redis/Kafka production platform

