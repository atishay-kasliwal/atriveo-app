# ── Product story (source of truth) ─────────────────────────────────────────

product:
  name: AI operating system for job search automation
  problem: >
    Job seekers manually track applications across boards, lack pipeline visibility,
    and spend hours tailoring resumes per role without evidence-backed bullet selection.
  solution: >
    Full-stack platform (updated 2026-10-09 from the code): Chrome extension captures LinkedIn/Indeed listings and
    syncs status from Gmail; React + TypeScript console on Cloudflare Pages (Workers functions, D1 sign-in with JWT,
    Google OAuth, PBKDF2); Node API and MongoDB on an Oracle VM with Docker resume workers (leased claims); resume
    compiler (beam search, RCS, Tectonic one-page gate) over a verified fact bank; deterministic ATS checker;
    Playwright apply engine (Greenhouse, Ashby, Lever, Workday adapters, safety layer, never submits); Claude/Codex
    structured outputs. 50K+ applications tracked and 50K+ resumes tailored in a year.
  users: 1K users over a year (confirmed 2026-10-08; the older "1K+ daily" is superseded)
  deployment: Cloudflare Pages + Workers, Docker
  open_source: GitHub (Chrome extension + application tracker)
  stack:
    frontend: [React, TypeScript, Vite, TailwindCSS]
    backend: [Node.js, MongoDB, Python]
    ai: [Claude, Codex, beam search, RCS, planner, ATS checker]
    infra: [Docker, Cloudflare Pages, Cloudflare Workers, Oracle Cloud, Playwright]
    extension: [Chrome Web Store]
    resume_engine: [Python, beam search, RCS, Tectonic PDF]

