# ── Product story (source of truth) ─────────────────────────────────────────

product:
  name: AI operating system for job search automation
  problem: >
    Job seekers manually track applications across boards, lack pipeline visibility,
    and spend hours tailoring resumes per role without evidence-backed bullet selection.
  solution: >
    Full-stack platform: open-source Chrome extension captures LinkedIn/Indeed listings;
    React dashboard with application tracker; LangChain RAG powers search; FastAPI +
    PostgreSQL backend; Python resume compiler (beam search, RCS, PDF gate) tailors
    one-page resumes from 5K+ weekly indexed job descriptions.
  users: 1K+ daily users
  deployment: Cloudflare Pages + Workers, Docker
  open_source: GitHub (Chrome extension + application tracker)
  stack:
    frontend: [React, TypeScript, Vite, TailwindCSS]
    backend: [Python, FastAPI, PostgreSQL]
    ai: [LangChain, RAG, beam search, RCS, planner]
    infra: [Docker, Cloudflare Pages, Cloudflare Workers]
    extension: [Chrome Web Store]
    resume_engine: [Python, beam search, RCS, Tectonic PDF]

