# Job Pipeline | Canonical achievement bank (review file)
# Bank v50
# Lint: npm run ac:bullet-lint -- --role job-pipeline

role:
  id: job-pipeline
  employer: Atriveo Job Intelligence Pipeline
  title: Data Engineer
  location: ""
  dates: ""
  slot_kind: project
  resume_pick_count: 2
  github: https://github.com/atishay-kasliwal/job-pipeline
  live: https://application.atriveo.com

product:
  name: Automated early-career SWE job intelligence pipeline
  problem: >
    LinkedIn surfaces irrelevant senior/SDET/clearance roles with no H1B signal or stack scoring;
    good roles disappear within hours.
  solution: >
    Python pipeline: JobSpy scrapes 6 LinkedIn search terms (~480 raw/run), 5-stage filter removes
    ~75%, keyword scoring ranks survivors, 5 tiered pipelines output JSON, MongoDB Atlas stores
    15K+ JDs, GitHub Contents API publishes hourly dashboard.
  stack:
    languages: [Python 3.13]
    scraping: [JobSpy, LinkedIn]
    data: [pandas, MongoDB Atlas]
    deploy: [GitHub Contents API, GitHub Pages]
    frontend: [Vanilla JS]
    automation: [macOS cron]

metrics:
  scraping:
    search_terms: 6
    raw_jobs_per_run: "~480"
    jobs_after_filter: "~109"
    filter_removal_rate: "~75%"
  automation:
    runs_per_day: "~20"
    runtime_per_run: "sub-15 minutes"
  storage:
    mongodb_jds: "15K+"
    mongodb_collections: 4
  pipelines:
    count: 5
    h1b_sponsors_2026: 1388
    top_500_companies: 521
    priority_companies: "~112"
  scoring:
    keyword_count: "30+"

achievements:
  - id: AC-083
    theme: platform-ownership
    resume_bullet: >-
      Built a Python automated job intelligence pipeline scraping LinkedIn via JobSpy
      across 6 search terms with ~20 daily runs serving a live production dashboard.
  - id: AC-084
    theme: filter-cascade
    resume_bullet: >-
      Engineered Python a 5-stage filter cascade removing ~75% of irrelevant listings
      and surfacing ~109 high-signal early-career roles from ~480 raw jobs per run.
  - id: AC-085
    theme: keyword-scoring
    resume_bullet: >-
      Built Python a keyword scoring engine with 30+ weighted tech terms ranking jobs by
      stack fit for backend, ML, and data science roles.
  - id: AC-086
    theme: h1b-pipeline
    resume_bullet: >-
      Shipped Python an H1B-aware pipeline matching listings against 1,388 verified 2026
      sponsors for sponsorship-focused early-career job search.
  - id: AC-087
    theme: mongodb-storage
    resume_bullet: >-
      Built Python and MongoDB Atlas storage for 15K+ job descriptions across 4
      collections with run history and per-run JSON snapshots for production analytics.
  - id: AC-088
    theme: multi-pipeline
    resume_bullet: >-
      Built Python 5 curated pipelines covering 521 Top 500 tech firms, priority company
