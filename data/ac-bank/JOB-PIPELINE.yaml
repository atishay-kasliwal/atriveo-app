  - id: AC-090
    theme: cron-automation
    resume_bullet: >-
      Automated Python ~20 daily macOS cron runs completing full scrape-to-deploy in
      under 15 minutes for production job intelligence delivery.
  - id: AC-091
    theme: admin-analytics
    resume_bullet: >-
      Built JavaScript admin analytics with hourly heatmaps and 7/14/30-day trend charts
      tracking pipeline breakdown and the last 50 production runs.
  - id: AC-092
    theme: ats-gap-analysis
    resume_bullet: >-
      Integrated Python ATS resume gap analysis scoring top-ranked jobs against a stored
      profile with 30+ keyword checks to surface gaps before applications.
review_scores:
