# ── Product story (source of truth — from README) ───────────────────────────

product:
  name: Event-driven insurance data transfer platform
  problem: >
    Third-party insurance providers need fault-tolerant, scalable transfer of policy data
    to a payment gateway without brittle point-to-point integrations.
  solution: >
    8 Spring Boot microservices on Java 11 with CQRS and event sourcing: ingestion publishes
    Avro events to a 3-broker Kafka cluster; consumers index into 3-node Elasticsearch;
    Kafka Streams powers real-time policy analytics; Spring Cloud Gateway handles JWT auth,
    Redis rate limiting, and circuit breaking; Netflix Eureka + Config Server; full
    Prometheus/Grafana/Zipkin/ELK observability via Docker Compose.
  stack:
    languages: [Java 11]
    frameworks: [Spring Boot 2.6, Spring Cloud 2021]
    messaging: [Apache Kafka, Avro, Confluent Schema Registry, Kafka Streams]
    search: [Elasticsearch 7.15]
    security: [JWT, Spring Security, Redis rate limiter, Resilience4j]
    infra: [Docker Compose, Netflix Eureka, Spring Cloud Config]
    observability: [Prometheus, Grafana, Zipkin, ELK]

