# Hard skills a job description can ask for, with the other ways they are written.
# Used by scripts/ac-jd-skills.mjs to score a resume the way outside ATS tools do: which of the
# skills this JD names appear in the resume text. Unlike ATS_COVERAGE_MATRIX.yaml it reads the
# JD, and unlike the bank's coverage audit it counts skills the bank has never heard of.
# Matching ignores case, hyphens and a trailing "s". Generic words ("AI", "cloud") are left out.

# Names that are also everyday words ("the rest of", "excel at", "a swift", "X-ray") match only
# when written with this exact capitalization.
case_sensitive: [REST, Excel, Swift, Spark, Ray, Bedrock, Express.js, SAS]

