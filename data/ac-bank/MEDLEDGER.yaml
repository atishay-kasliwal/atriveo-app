# MedLedger | Canonical achievement bank (review file)
# Bank v50
# Lint: npm run ac:bullet-lint -- --role medledger

role:
  id: medledger
  employer: MedLedger
  title: Full Stack Engineer
  location: ""
  dates: June 2024 -- August 2024
  slot_kind: project
  resume_pick_count: 2
  github: https://github.com/atishay-kasliwal/MedLedger

product:
  name: Medical clinic management system
  problem: >
    Small clinics need a single system to manage patients, doctors, appointments, and role-specific
    workflows without siloed spreadsheets or ad hoc tools.
  solution: >
    Node.js and Express REST API with MongoDB/Mongoose, JWT + bcrypt auth, RBAC for Admin/Doctor/Patient,
    EJS dashboards, Swagger OpenAPI docs, and Helmet/CORS/CSRF security middleware.
  stack:
    backend: [Node.js, Express.js, MongoDB, Mongoose]
    auth: [JWT, bcrypt, RBAC]
    frontend: [EJS, JavaScript]
    security: [Helmet, CORS, CSRF]
    docs: [Swagger OpenAPI]

metrics:
  roles: 3
  note: No production user counts or scale metrics in README — do not invent

