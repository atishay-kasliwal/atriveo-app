# ── Canonical achievements (immutable resume bullets) ───────────────────────

achievements:

  - id: AC-031
    display_order: 1
    theme: product-ownership
    skills: [Full stack, architecture, leadership, clinical AI product]
    fact: End-to-end AI radiology platform in clinical use processing 10K+ brain MRI studies for a 20-person physician-research team.
    metrics_used: [10K+ studies, 3h→2min, 90%+ accuracy, 2min latency, clinical deployment]
    resume_bullet: >-
      Designed a Python and GCP-based AI radiology platform that processed 10K+ brain MRI studies and reduced
      tumor segmentation from 3 hours to 2 minutes.
    review_notes: |
      Pinned first on every Wake Forest resume (headline bullet). Impossible-to-ignore summary
      — recruiter gets the full story in one scan. Say "Architected" only if you owned system design.

  - id: AC-032
    display_order: 2
    theme: mri-preprocessing
    skills: [Python, backend, image processing, SimpleITK]
    fact: SimpleITK pipelines standardizing 5 MRI modalities (T1, T2, DWI, heatmap, FLAIR) from 10+ scan types.
    metrics_used: [5 modalities, 10+ scan types]
    resume_bullet: >-
      Standardized 5 MRI modalities using Python and SimpleITK, enabling automated brain tumor segmentation
      across heterogeneous clinical scans.
    review_notes: |
      Backend / data-engineering pick. Ends with outcome (segmentation + inference), not just infra.

  - id: AC-033
    display_order: 3
    theme: tumor-segmentation
    skills: [ML, computer vision, segmentation]
    fact: Brain tumor segmentation model at 90%+ mask accuracy across 10K+ multimodal clinical MRI studies.
    metrics_used: [90%+ accuracy, 10K+ studies]
    resume_bullet: >-
      Attained 90%+ mask accuracy with a Python brain tumor segmentation model replacing manual tumor
      outlining for treating clinicians in production.
    review_notes: |
      Does not repeat 3h→2min (that lives in pinned AC-031). Compatible with AC-048 human-in-the-loop.

  - id: AC-043
    display_order: 4
    theme: data-etl
    skills: [Data engineering, Python, Apache Airflow, ETL]
    fact: Apache Airflow ETL workflows processing 10+ heterogeneous MRI scan types into research-ready datasets.
