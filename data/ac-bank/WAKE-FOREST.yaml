# ── Product story (source of truth) ─────────────────────────────────────────

product:
  name: AI-powered medical-imaging platform
  problem: >
    Brain tumor evaluation required radiologists to manually review multiple MRI scan
    types with inconsistent slice counts, clarity, and dimensions. Preprocessing,
    alignment, and tumor marking were slow and error-prone.
  solution: >
    End-to-end platform on GCP: MRI upload triggers automated preprocessing
    (registration, denoising, alignment to a unified plane), AI tumor segmentation,
    PyRadiomics feature extraction, patient similarity search, survival analysis,
    and a clinician dashboard for review and mask correction.
  users: Treating physicians and researchers (20-person team)
  deployment: Clinical production use
  stack:
    languages: [Python]
    imaging: [SimpleITK, PyRadiomics]
    cloud: [GCP]
    orchestration: [Apache Airflow]
    frontend: [React, TypeScript, Redux]
    domain: [MRI, brain tumor, radiomics, survival analysis, medical imaging]

confirmed_technology_context:
  retrieval: ChromaDB preceded Pinecone; ChromaDB remains for lower-cost workflows.
  llm: Anthropic
  agents: MCP servers and function calling.
  modeling: PyTorch, TensorFlow, and scikit-learn were used for models.
  conference_workflow: A similar model workflow existed; launch status and provider details are unconfirmed, so do not claim a live deployment.

