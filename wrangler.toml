name = "atriveo-app"
compatibility_date = "2024-01-01"
pages_build_output_dir = "dist"

[[d1_databases]]
binding = "atriveo_auth"
database_name = "atriveo-auth"
database_id = "c80daf92-78af-4216-b552-d435ee9ab323"
migrations_dir = "migrations"

# Secrets (set via Cloudflare Pages dashboard → Settings → Environment Variables):
# JWT_SECRET  — random 32+ char string for signing session tokens
# TRACKER_API_URL — Atriveo tracker API base URL, e.g. https://job-tracker-api.katishay.workers.dev
# TRACKER_API_TOKEN — Bearer token for /integrations/atriveo/applications; server secret only
# TAILOR_ORIGIN — cloudflared public URL → localhost:8787, e.g. https://tailor-relay.atriveo.com
# TAILOR_TOKEN  — shared secret (same value on Mac as TAILOR_TOKEN env when running npm run tailor)
